name: Quality checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Install Korean fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Test
        run: uv run pytest tests/ -q
      - name: Build distributions
        run: uv build
      - name: Verify wheel contents
        id: wheel_contents
        shell: uv run python {0}
        run: |
          import logging
          import tomllib
          import zipfile
          from pathlib import Path

          logging.basicConfig(level=logging.INFO)
          with Path("pyproject.toml").open("rb") as config_file:
              config = tomllib.load(config_file)
          expected = sorted(config["tool"]["hatch"]["build"]["targets"]["wheel"]["only-include"])
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as wheel:
              actual = sorted(
                  name for name in wheel.namelist()
                  if not name.endswith("/") and not name.split("/", 1)[0].endswith(".dist-info")
              )
          assert actual == expected, f"Wheel payload differs: expected {expected}, got {actual}"
          logging.info("Wheel payload verified: %d engine modules", len(actual))
      - name: Verify Python 3.12 syntax
        id: python312
        shell: uv run python {0}
        run: |
          import ast
          import logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO)
          sources = sorted(Path(".").glob("*.py"))
          assert sources, "No top-level Python modules found"
          for source in sources:
              ast.parse(source.read_text(encoding="utf-8-sig"), filename=str(source), feature_version=(3, 12))
          logging.info("Python 3.12 syntax verified: %d modules", len(sources))

  word-schema:
    name: Word schema gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Download and verify validator
        shell: bash
        run: |
          url=$(uv run --no-sync python -c 'import json, sys; from pathlib import Path; sys.stdout.write(json.loads(Path("scripts/word_schema_validator_assets.json").read_text())["assets"]["linux-x64.zip"]["url"])')
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/linux-x64.zip" "$url"
          uv run --no-sync python -m scripts.validate_word_schema verify-asset "$RUNNER_TEMP/linux-x64.zip"
      - name: Render corpus and validate Word schema
        run: >-
          uv run --no-sync python -m scripts.validate_word_schema validate
          "$RUNNER_TEMP/linux-x64.zip"
          --output-dir "$RUNNER_TEMP/word-schema-docx"
          --report word-schema-report.json
      - name: Ensure a report exists after setup failures
        if: always()
        shell: bash
        run: |
          if [ ! -f word-schema-report.json ]; then
            printf '%s\n' '{"ok": false, "stage": "setup", "documents": [], "failure": "Validation did not run; see the job log."}' > word-schema-report.json
          fi
      - name: Upload Word schema report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-schema-report
          path: word-schema-report.json
          if-no-files-found: error
