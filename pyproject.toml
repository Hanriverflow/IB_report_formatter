[project]
name = "ib-report-formatter"
version = "2.0.0"
description = "Markdown to Word for IB reports and Korean business documents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DCM Team"}
]
keywords = ["markdown", "word", "docx", "investment-banking", "report", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "python-docx>=0.8.11",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
full = [
    "charset-normalizer>=3.0", # Better encoding detection for Korean
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0,<1.18",
    "types-PyYAML>=6.0",
]

[project.scripts]
ib-report = "md_to_word:main"
md-to-word = "md_to_word:main"
md-format = "md_formatter:main"
docx-audit = "docx_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "chart_renderer.py",
    "cli_utils.py", "converters.py", "deep_md_cleaner.py", "diagram_renderer.py",
    "document_model.py", "document_profiles.py", "docx_audit.py", "ib_renderer.py",
    "md_formatter.py", "md_parser.py", "md_to_word.py", "office_layout.py",
    "ooxml_order.py", "render_styles.py", "stream_utils.py", "term_sheet.py", "term_variables.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/chart_renderer.py",
    "/cli_utils.py", "/converters.py", "/deep_md_cleaner.py", "/diagram_renderer.py",
    "/document_model.py", "/document_profiles.py", "/docx_audit.py", "/ib_renderer.py",
    "/md_formatter.py", "/md_parser.py", "/md_to_word.py", "/office_layout.py", "/ooxml_order.py",
    "/render_styles.py", "/stream_utils.py", "/term_sheet.py", "/term_variables.py",
    "/pyproject.toml", "/uv.lock",
    "/README.md", "/README.ko.md", "/CHANGELOG.md", "/AGENTS.md", "/LICENSE",
    "/samples/profiles/**", "/samples/qa/**", "/scripts/word_visual_qa.ps1", "/docs/implementation-plan-20260914.md",
    "/docs/verification-20260914.md",
    "/docs/improvement-plan-20260915.md", "/docs/verification-20260915.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    # Enabled by the Python 3.12 target; modernize in a follow-up PR.
    "B905",   # zip without explicit strict
    "UP006",  # use built-in collection annotations
    "UP007",  # use union operator annotations
    "UP035",  # deprecated typing imports
    "UP045",  # use union operator for Optional annotations
]

[tool.ruff.lint.isort]
known-first-party = [
    "chart_renderer",
    "cli_utils",
    "deep_md_cleaner",
    "ib_renderer",
    "md_formatter",
    "md_parser",
    "document_model",
    "document_profiles",
    "docx_audit",
    "md_to_word",
    "converters",
    "office_layout",
    "ooxml_order",
    "render_styles",
    "stream_utils",
    "term_sheet",
    "term_variables",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
